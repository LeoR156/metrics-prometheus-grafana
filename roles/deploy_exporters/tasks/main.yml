- name: Скачать и распаковать архив экспортера
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/opt/node_exporter-{{ node_exporter_version }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "/opt/node_exporter-{{ node_exporter_version }}/node_exporter"
    owner: node_exporter
    group: node_exporter

- name: Создать симлинк на исполняемый файл
  ansible.builtin.file:
    src: "/opt/node_exporter-{{ node_exporter_version }}/node_exporter"
    dest: "/usr/local/bin/node_exporter"
    state: link
    force: true 

- name: Создать директорию для конфигурации экспортера
  ansible.builtin.file:
    path: /etc/node_exporter
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0750'

- name: Скопировать конфиг веб-авторизации для Node Exporter
  ansible.builtin.template:
    src: node-exporter-web.yml.j2
    dest: /etc/node_exporter/web.yml
    owner: node_exporter
    group: node_exporter
    mode: '0600'

- name: Создать systemd unit файл
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: restart node-exporter

- name: Включить автозапуск и запустить сервис
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true

- name: Создание пользователя и директорий для метрик
  ansible.builtin.import_tasks: create_user_node_exporter_and_dir.yml

- name: Подключение роли установки Docker
  ansible.builtin.import_role:
    name: install_Docker_and_utilities